#
# Command Center quick capture inside herdr. Explicit actions only: nothing
# runs at startup or on events. Linked by install/install-herdr-plugin.sh.

id = "command-center"
name = "Command Center"
version = "0.1.0"
description = "Quick capture into the Command Center with the current pane's folder as context."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# The capture form: a small popup that runs `cc add` and closes when done.
[[panes]]
id = "capture"
title = "Quick capture"
placement = "popup"
width = 96
height = 12
command = ["bash", "scripts/capture.sh"]

# Bind this action to a key in herdr. It resolves the cwd of the pane it
# was invoked from (or the focused pane) and opens the capture popup there.
[[actions]]
id = "quick-capture"
title = "Quick capture"
description = "Capture a task into the Command Center with this pane's folder as context."
contexts = ["pane", "workspace", "global"]
command = ["bash", "scripts/open-capture.sh"]
